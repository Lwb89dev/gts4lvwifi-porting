# The speakers are MultiMedia1 of the sdm660 sound card, a stereo stream the four amplifiers
# split into left (slot 0) and right (slot 1). The card has no ACP profile, so PipeWire offers
# "Pro Audio": eight unnamed AUX channels at 24 bits, and a normal stereo stream finds no
# channel to land on (silence). Present the speakers as what they are, stereo FL FR at 16 bits,
# the format the amplifiers were proven with.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.pro-output-0" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        node.description = "Tab S5e speakers"
        node.nick = "Speakers"
        # do not switch the amplifiers off and on around every sound
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

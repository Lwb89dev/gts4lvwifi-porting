# WirePlumber's Bluetooth monitor registers the A2DP endpoints with BlueZ only when its
# user is on the active logind seat. The audio server runs for the "alarm" user with no
# login session (linger), so it has no seat and BlueZ never got an "Audio Sink": a phone
# could pair but not connect. The system-wide profile already turns the check off; this does
# it for the normal profile too.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

# A Pixel offers Google's Opus codec first, and PipeWire 1.6.10 / WirePlumber 0.5.18 then
# failed to create the node for it ("failed to create node from factory 'adapter'"), so the
# music went nowhere. Offer only the ordinary codecs.
monitor.bluez.properties = {
  bluez5.codecs = [ sbc sbc_xq aac ]
}

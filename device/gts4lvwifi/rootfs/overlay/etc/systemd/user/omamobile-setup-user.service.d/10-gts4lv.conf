[Unit]
# The ALARM account exists before Omamobile is installed, so firstboot never
# creates the profile marker used by the vendor unit as its admission check.
# Let the idempotent setup run once at the first graphical login instead.
ConditionPathExists=

[Service]
# Keep tablet-specific policy after the upstream mobile profile is provisioned
# and after any later Omamobile migration updates it.
ExecStartPost=/usr/lib/gts4lv/finalize-mobile-user

# wlan0 exists only once the modem has started (gts4lv-modem, after sshd and
# network.target). With the stock "Before=network.target" and a start at boot,
# network.target and sshd with it waited 90 s for a device that could not appear
# before them. Udev starts this unit when wlan0 appears (90-gts4lv-wlan.rules).
# No config, no start: the credentials belong to the owner and are never in the image.
[Unit]
Before=
ConditionPathExists=/etc/wpa_supplicant/wpa_supplicant-%I.conf

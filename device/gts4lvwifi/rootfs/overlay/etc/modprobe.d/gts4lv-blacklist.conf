# Modules that must not be loaded by udev's alias matching at boot. Each one is
# loaded by hand, or by a unit, once what it needs is in place; "blacklist"
# only stops the automatic load, modprobe <name> still works.

# The LPASS LPI pins are dead until the ADSP runs, and touching them hangs the
# bus. gts4lv-dsp loads this after remoteproc adsp is running.
blacklist pinctrl_sdm670_lpass_lpi

# They ask for firmware in probe and fail for good if the firmware path is not
# set yet (gts4lv-firmware sets it).
blacklist hci_uart
blacklist venus_core

# Display and GPU: the handover from the boot framebuffer is its own attempt.
blacklist msm
blacklist panel_samsung_ana38401

# The touchscreen driver is new: loaded by hand until it has run safely.
blacklist fts1ba90a

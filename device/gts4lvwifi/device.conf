# SPDX-License-Identifier: MIT
# Samsung Galaxy Tab S5e (Wi-Fi), SM-T720 / SM-T720N, codename gts4lvwifi.
# Same KEY=value rules as omarchy-mobile device descriptors: no shell.
#
# This tablet is not an A/B Pixel. Omarchy's install-phone path does not
# apply. Linux is packed into the recovery partition; LineageOS stays in boot.
# Nothing in this repo flashes a partition.

CODENAME=gts4lvwifi
NAME="Samsung Galaxy Tab S5e (Wi-Fi)"
MODELS="SM-T720 SM-T720N"
SOC=sdm670
COMPATIBLE="samsung,gts4lvwifi"
PACKAGE=omamobile-device-gts4lvwifi

# samsung-recovery: header v1 boot image, Image.gz with the DTB appended,
# Lineage's own recovery_dtbo beside it. Not qcom-abl, not a fastboot slot.
BOOT_METHOD=samsung-recovery
BOOT_IMAGES=recovery
STORAGE=emmc
PARTITION_BOOT=boot
PARTITION_RECOVERY=recovery
PARTITION_USERDATA=userdata

DTB=qcom/sdm670-samsung-gts4lvwifi.dtb
KERNEL_DEFCONFIG=defconfig
KERNEL_FRAGMENT=arch/arm64/configs/sdm670.config
PANEL_SIZE=2560x1600

# From Lineage android_device_samsung_gts4lv-common BoardConfigCommon.mk
# (lineage-22.2). The bootloader reads the DTB off the end of Image.gz.
HEADER_VERSION=1
PAGESIZE=4096
KERNEL_BASE=0x00000000
KERNEL_OFFSET=0x00008000
RAMDISK_OFFSET=0x02000000
TAGS_OFFSET=0x01E00000
BOOT_PARTITION_SIZE=67108864
RECOVERY_PARTITION_SIZE=67108864

# fw_devlink.sync_state=timeout is required: the Adreno GMU has no driver of
# its own, so without the timeout the bootloader's power domains stay on.
CMDLINE="console=tty0 fw_devlink.sync_state=timeout clk_ignore_unused pd_ignore_unused panic=10"
